  name: Tap Payments Webhooks
  tags:
  - Webhooks
  - Events
  - Notifications
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.tap.company/docs/webhook
  baseURL: https://api.tap.company/v2
  properties:
  - url: https://developers.tap.company/docs/webhook
    type: Documentation
  description: >-
    Server-to-server HTTP POST callbacks (Instant Payment Notification) that Tap sends to your configured
    endpoint when a charge, authorize, invoice, or recurring payment changes state. Payloads are signed
    with an HMAC-SHA256 hashstring header for verification. This is HTTP push, not a WebSocket.
